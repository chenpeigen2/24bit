[package]
name = "twentyfourbit-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Desktop client for 24bit.net (Tauri shell)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
twentyfourbit-core = { path = "../twentyfourbit-core" }
twentyfourbit-player = { path = "../twentyfourbit-player" }
tauri = { version = "2", features = [] }
serde.workspace = true
dirs = "7.0"
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Cover colour extraction: the webview cannot read pixels from a CDN image
# (canvas is tainted without CORS headers), so the accent colour is computed
# here from the actual bytes.
reqwest = { workspace = true, features = ["blocking"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
