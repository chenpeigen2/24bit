[workspace]
members = [
    "twentyfourbit-core",
    "twentyfourbit-player",
    "twentyfourbit-cli",
    "twentyfourbit-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.82"
repository = "https://github.com/chenpeigen/24bit"
description = "Unofficial Rust client for 24bit.net (Hi-Res lossless music)"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "rustls-native-certs"] }
futures-util = "0.3"
tracing = "0.1"
