[package]
name = "twentyfourbit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Command-line client for 24bit.net"

[[bin]]
name = "24bit"
path = "src/main.rs"

[dependencies]
twentyfourbit-core = { path = "../twentyfourbit-core" }
twentyfourbit-player = { path = "../twentyfourbit-player" }
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow = "1.0"
indicatif = "0.18"
dirs = "7.0"
toml = { version = "1.2", features = ["parse", "display", "serde"] }

[dev-dependencies]
serde_json.workspace = true
