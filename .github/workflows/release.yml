name: release

# Build installers for every desktop platform and publish them as a GitHub
# Release. Triggered by a version tag, or by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. v1.0.0). Required for a manual run."
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: 24bit
  APP: 24bit
  CRATE: twentyfourbit-tauri

jobs:
  # Fail fast: a release with a broken test suite is worse than no release.
  test:
    name: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev \
            fonts-noto-cjk
      # Split per crate on purpose: when something fails on a platform I cannot
      # reproduce locally, the failed step name is the only diagnostic available
      # from the public API without a token.
      - name: Test core
        env: { LIBGL_ALWAYS_SOFTWARE: "1" }
        run: cargo test -p twentyfourbit-core --no-fail-fast

      - name: Test player
        env: { LIBGL_ALWAYS_SOFTWARE: "1" }
        run: cargo test -p twentyfourbit-player --no-fail-fast

      - name: Test tauri
        id: tauri
        continue-on-error: true
        env: { LIBGL_ALWAYS_SOFTWARE: "1" }
        run: cargo test -p twentyfourbit-tauri --no-fail-fast 2>&1 | tee /tmp/tauri.log

      # Job logs need a token to download, so a failure on a platform I cannot
      # reproduce locally is otherwise invisible. Publish the log to a branch
      # instead: it is readable, and it costs one push.
      - name: Publish failure log
        if: steps.tauri.outcome == 'failure'
        run: |
          mkdir -p ci-logs
          tail -c 200000 /tmp/tauri.log > ci-logs/tauri.log
          git config user.name "ci"
          git config user.email "ci@localhost"
          git checkout -B ci-logs
          git add ci-logs/tauri.log
          git commit -m "ci: tauri test log" || true
          git push -f origin ci-logs
          echo "log published to the ci-logs branch"

      - name: Fail if tauri tests failed
        if: steps.tauri.outcome == 'failure'
        run: exit 1

      - name: Test cli
        env: { LIBGL_ALWAYS_SOFTWARE: "1" }
        run: cargo test -p twentyfourbit-cli --no-fail-fast

      - name: Build all targets
        run: cargo build --workspace --all-targets

  build:
    name: ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
            target: aarch64-apple-darwin
          - os: macos-latest
            name: macos-x64
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            name: linux-x64
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            name: windows-x64
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev \
            rpm dpkg-dev

      # Tauri embeds the frontend at compile time via tauri-build, so the UI
      # must be built before the Rust crate.
      - name: Build frontend
        run: |
          cd twentyfourbit-tauri/ui
          npm ci
          npm run build

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p ${{ env.CRATE }}

      # ---------------------------------------------------------------- macOS
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-v0.0.0}"
          VERSION="${VERSION#v}"
          # The .app bundle is staged outside dist/ so that dist/ holds nothing
          # but release assets: the upload below ships the whole directory.
          APP_DIR="$RUNNER_TEMP/$APP.app"
          rm -rf dist "$APP_DIR"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources" dist
          cp "target/${{ matrix.target }}/release/$BIN" "$APP_DIR/Contents/MacOS/$APP"
          cp twentyfourbit-tauri/icons/icon.icns "$APP_DIR/Contents/Resources/icon.icns"
          cat > "$APP_DIR/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key><string>24bit</string>
              <key>CFBundleDisplayName</key><string>24bit</string>
              <key>CFBundleIdentifier</key><string>net.twentyfourbit.client</string>
              <key>CFBundleVersion</key><string>$VERSION</string>
              <key>CFBundleShortVersionString</key><string>$VERSION</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleExecutable</key><string>24bit</string>
              <key>CFBundleIconFile</key><string>icon.icns</string>
              <key>LSMinimumSystemVersion</key><string>11.0</string>
              <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          # Ad-hoc signature: without one, Gatekeeper refuses the bundle outright.
          codesign --force --deep --sign - "$APP_DIR"
          # ditto preserves the bundle's metadata and symlinks; zip(1) does not.
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "dist/$APP-${{ matrix.name }}-$VERSION.zip"

      # ---------------------------------------------------------------- Linux
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-v0.0.0}"
          VERSION="${VERSION#v}"
          BIN_PATH="target/${{ matrix.target }}/release/$BIN"
          # Staging trees live outside dist/ so that dist/ holds nothing but
          # release assets: the upload below ships the whole directory.
          WORK="$RUNNER_TEMP/24bit-pkg"
          rm -rf dist "$WORK"
          mkdir -p dist "$WORK"

          # --- staged tree shared by deb, rpm and the AppDir
          stage() {
            local root="$1"
            mkdir -p "$root/usr/bin" "$root/usr/share/applications" \
                     "$root/usr/share/icons/hicolor/512x512/apps" \
                     "$root/usr/share/doc/24bit"
            install -m755 "$BIN_PATH" "$root/usr/bin/24bit"
            install -m644 packaging/24bit.desktop "$root/usr/share/applications/24bit.desktop"
            install -m644 twentyfourbit-tauri/icons/icon.png "$root/usr/share/icons/hicolor/512x512/apps/24bit.png"
          }

          # --- .deb
          DEB="$WORK/deb"
          stage "$DEB"
          mkdir -p "$DEB/DEBIAN"
          INSTALLED=$(du -sk "$DEB/usr" | cut -f1)
          cat > "$DEB/DEBIAN/control" <<EOF
          Package: 24bit
          Version: $VERSION
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: chenpeigen <chenpeigen@users.noreply.github.com>
          Installed-Size: $INSTALLED
          Depends: libasound2, libxkbcommon0, libwayland-client0, libx11-6, libgl1
          Description: Unofficial desktop client for 24bit.net
           Hi-Res lossless music browser, player and downloader for 24bit.net,
           written in Rust.
          EOF
          dpkg-deb --root-owner-group --build "$DEB" "dist/24bit_${VERSION}_amd64.deb"

          # --- .rpm
          RPMROOT="$WORK/rpmbuild"
          mkdir -p "$RPMROOT"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cat > "$RPMROOT/SPECS/24bit.spec" <<EOF
          Name: 24bit
          Version: $VERSION
          Release: 1
          Summary: Unofficial desktop client for 24bit.net
          License: MIT OR Apache-2.0
          URL: https://github.com/${{ github.repository }}
          BuildArch: x86_64
          Requires: alsa-lib, libxkbcommon, wayland, libX11, mesa-libGL
          %description
          Hi-Res lossless music browser, player and downloader for 24bit.net.
          %install
          mkdir -p %{buildroot}/usr/bin %{buildroot}/usr/share/applications \\
                   %{buildroot}/usr/share/icons/hicolor/512x512/apps
          install -m755 $PWD/$BIN_PATH %{buildroot}/usr/bin/24bit
          install -m644 $PWD/packaging/24bit.desktop %{buildroot}/usr/share/applications/24bit.desktop
          install -m644 $PWD/twentyfourbit-tauri/icons/icon.png %{buildroot}/usr/share/icons/hicolor/512x512/apps/24bit.png
          %files
          /usr/bin/24bit
          /usr/share/applications/24bit.desktop
          /usr/share/icons/hicolor/512x512/apps/24bit.png
          EOF
          rpmbuild --define "_topdir $RPMROOT" -bb "$RPMROOT/SPECS/24bit.spec"
          cp "$RPMROOT"/RPMS/x86_64/*.rpm dist/

          # --- AppImage
          APPDIR="$WORK/24bit.AppDir"
          stage "$APPDIR"
          cp twentyfourbit-tauri/icons/icon.png "$APPDIR/24bit.png"
          cp packaging/24bit.desktop "$APPDIR/24bit.desktop"
          cat > "$APPDIR/AppRun" <<'APPRUN'
          #!/bin/sh
          HERE=$(dirname "$(readlink -f "$0")")
          exec "$HERE/usr/bin/24bit" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          # The GitHub runner has no FUSE, so extract and run instead.
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run \
            "$APPDIR" "dist/24bit-${VERSION}-x86_64.AppImage"

      # -------------------------------------------------------------- Windows
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if (-not $version) { $version = "0.0.0" }
          # The staged tree lives outside dist/ so that dist/ holds nothing but
          # release assets: the upload below ships the whole directory.
          $stage = Join-Path $env:RUNNER_TEMP "24bit"
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\$env:BIN.exe" "$stage\24bit.exe"
          Copy-Item "twentyfourbit-tauri\icons\icon.png" "$stage\icon.png"
          Copy-Item "README.md" "$stage\README.md"
          Compress-Archive -Path $stage -DestinationPath "dist\24bit-${{ matrix.name }}-$version.zip" -Force

      # Assert here rather than at upload time: a packaging step that writes
      # nothing must fail with the name of the missing artefact, and the
      # upload-artifact error is not reachable without a token.
      - name: Verify installers
        shell: bash
        run: |
          set -uo pipefail
          ls -lR dist
          case "${{ matrix.name }}" in
            linux-*) expected="dist/*.deb dist/*.rpm dist/*.AppImage" ;;
            *)       expected="dist/*.zip" ;;
          esac
          status=0
          # Word splitting is intended: one glob per element.
          for pattern in $expected; do
            # shellcheck disable=SC2086
            if ls $pattern > /dev/null 2>&1; then
              echo "ok: $pattern"
            else
              echo "::error::the packaging step produced no file matching $pattern"
              status=1
            fi
          done
          exit $status

      # upload-artifact splits `path` on newlines only. A space-separated list
      # such as `dist/*.zip dist/*.deb` is one literal glob that matches
      # nothing, which is what made every build fail here while the packaging
      # steps had in fact succeeded.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/
          if-no-files-found: error

      # Job logs need a token to download. Dumping the state to a branch is the
      # only way to see why a runner I cannot reproduce locally failed. One
      # branch per matrix entry, so four concurrent failures cannot overwrite
      # each other.
      - name: Publish failure log
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-logs
          {
            echo "== ${{ matrix.name }} =="
            echo "== ls -lR dist =="
            ls -lR dist || true
            echo "== staging tree =="
            ls -lR "$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")" || true
          } > "ci-logs/build-${{ matrix.name }}.log"
          git config user.name "ci"
          git config user.email "ci@localhost"
          git checkout -B "ci-logs/${{ matrix.name }}"
          git add ci-logs
          git commit -m "ci: ${{ matrix.name }} build log" || true
          git push -f origin "ci-logs/${{ matrix.name }}"

  publish:
    name: publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artefacts
        run: ls -lhR artifacts
      - uses: softprops/action-gh-release@v2
        with:
          # One pattern per extension and fail_on_unmatched_files: a release
          # that is missing a platform is worse than no release at all.
          files: |
            artifacts/*.zip
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.AppImage
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          # A tag with a "-" is a pre-release, which keeps "latest" pointing at
          # something users should actually install.
          prerelease: ${{ contains(github.ref_name, '-') }}
